<html lang="en" class="dark">

    <meta charset="UTF-8" />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="description" content="Financial News Simplifier: AI-powered financial news platform that converts complex financial articles into concise, easy-to-understand explanations with key takeaways, glossary terms, and market impact analysis." />
    <meta property="og:title" content="AlfredoNews AI – Financial News Simplifier" />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('alfredonews_theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-800 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
